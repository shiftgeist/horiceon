[tools]
"bun" = "latest"
"dprint" = "latest"
"go:github.com/a-h/templ/cmd/templ" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:mvdan.cc/sh/v3/cmd/shfmt" = "latest"
"go" = "latest"
"node" = "latest"
"npm:agent-browser" = "latest"
"npm:corepack" = "latest"
"npm:cpd" = "latest"
"npm:npq" = "latest"
"npm:sort-package-json" = "latest"
"npm:typescript" = "latest"
"npm:zx" = "latest"
"python" = "3"
"rust" = "latest"
"uv" = "latest"

[settings]
disable_backends = ["asdf", "pipx"]
experimental = true
idiomatic_version_file_enable_tools = [
  "node",
  "python",
  "go",
  "terraform",
  "yarn",
]
legacy_version_file = true
minimum_release_age = "7d"

[hooks]
postinstall = "uv tool update --all"

[env]
_.path = ["{{config_root}}./node_modules/.bin"]

[tasks.install-headroom]
run = "uv tool install --python 3.13 \"headroom-ai[all]\"@latest"

[tasks.install-markitdown]
run = "uv tool install --python 3.13 markitdown@latest"

[tasks.install-herdr-oc]
run = "herdr integration install opencode"
