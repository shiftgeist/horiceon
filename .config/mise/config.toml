[tools]
"bun" = "latest"
"deno" = "latest"
"dprint" = "latest"
"go:github.com/a-h/templ/cmd/templ" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:mvdan.cc/sh/v3/cmd/shfmt" = "latest"
"go" = "latest"
"node" = "latest"
"npm:corepack" = "latest"
"npm:cpd" = "latest"
"npm:npq" = "latest"
"npm:sort-package-json" = "latest"
"npm:zx" = "latest"
"python" = "3"
"uv" = "latest"

[settings]
always_keep_download = true
disable_backends = ["asdf", "pipx"]
experimental = true
idiomatic_version_file_enable_tools = [
  "node",
  "python",
  "go",
  "terraform",
  "yarn",
]
legacy_version_file = true
minimum_release_age = "7d"

# use in projects
# [hooks]
# postinstall = 'npx corepack enable && corepack prepare'

[env]
_.path = ['{{config_root}}./node_modules/.bin']

[tasks.install-headroom]
run = 'uv tool install --python 3.13 "headroom-ai[all]"'
